name: Deploy talk branch to gh-pages

on:
  push:
    branches:
      - 'talk-*'  # any branch starting with "talk-"

permissions:
  contents: write  # needed for pushing to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: if Reveal.js needs a build step, do it here
      # e.g. npm install && npm run build
      - name: Prepare build output
        run: |
              TMPDIR=$(mktemp -d)
              cp -r * "$TMPDIR/"

      - name: Deploy to gh-pages subfolder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: $TMPDIR
          destination_dir: ${{ github.ref_name }}  # e.g. "talk-2024"
